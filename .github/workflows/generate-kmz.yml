name: Generate latest NL lightning KMZ

on:
  workflow_dispatch: {}
  schedule:
    # Every 20 minutes. GitHub cron can slip a few minutes under load, so
    # treat this as "roughly every 20 min," not exact.
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: generate-kmz
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate KMZ (last 30 min of GLM flashes over NL)
        run: python -m sheerr_lightning.generate --once --no-upload

      - name: Publish snapshot to latest/
        run: |
          mkdir -p latest
          cp work/glm_lightning_live.kmz latest/nl_lightning_latest.kmz

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest/nl_lightning_latest.kmz
          if git diff --cached --quiet; then
            echo "No change (identical flash data) — skipping commit."
            exit 0
          fi
          git commit -m "Update latest NL lightning KMZ [skip ci]"
          # The KMZ is binary, so a rebase can't auto-merge two concurrent
          # updates. On a race, just re-base our snapshot onto whatever
          # landed first — the newest generated data always wins, there's
          # no history worth preserving in this file.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — retrying against latest origin."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add latest/nl_lightning_latest.kmz
            git commit -m "Update latest NL lightning KMZ [skip ci]"
          done
          echo "::error::Failed to push after multiple retries."
          exit 1
