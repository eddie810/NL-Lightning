name: Generate latest NL lightning KMZ

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate KMZ (last 30 min of GLM flashes over NL)
        run: python -m sheerr_lightning.generate --once --no-upload

      - name: Publish snapshot to latest/
        run: |
          mkdir -p latest
          cp work/glm_lightning_live.kmz latest/nl_lightning_latest.kmz

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest/nl_lightning_latest.kmz
          if git diff --cached --quiet; then
            echo "No change (identical flash data) — skipping commit."
          else
            git commit -m "Update latest NL lightning KMZ [skip ci]"
            git push
          fi
